profile:
  name: "Lewis Hamilton"
  number: "44"
  nationality: "British"
  born: "7 January 1985"
  birthplace: "Stevenage, England"
  championships: "7 Formula One World Championships"
  summary: >-
    Lewis Hamilton is one of the defining drivers of modern Formula One.
    Known for his speed, consistency and wet-weather ability, he shares the
    record for the most Formula One World Drivers' Championships and has
    achieved more than 100 Grand Prix victories and pole positions.

